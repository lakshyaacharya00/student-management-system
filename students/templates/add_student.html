{% extends 'base.html' %}
{% block title %}
Add Student
{% endblock %}


{% block content %}
<div class="form-container">

       <div class="form-header">

        <h1>Add Student</h1>

        <p>
            Enter student details below.
        </p>

    </div>

    {% if message %}
    <div class="form-message">
            {{ message }}
        </div>
    {% endif %}
<div class="form-card">
    <form action="" method="post">
        {% csrf_token %}

        <div class="form-group">
        <label>Name: </label>
        <input type="text" placeholder="enter name" name="name" required>
        </div>


        <div class="form-group">
        <label>Age: </label>
        <input type="number" placeholder="enter age" min="1" max="100" name="age" required>
        </div>
        
        <div class="form-group">
        <label>Branch: </label>
        <input type="text" placeholder="enter branch" name="branch" required>
        </div>

        <div class="form-buttons">
              <button
                    type="submit"
                    class="save-btn"
                >
                    Add Student
                </button>

                 <a
                    href="{% url 'home' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>



        </div>

    </form>
    </div>

</div>
{% endblock %}
